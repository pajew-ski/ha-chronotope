add_event:
  name: Add event
  description: >-
    Creates or updates an event (upsert by id). Times must be ISO 8601 with
    a timezone offset; an address without coordinates is resolved from the
    address geo cache when known.
  fields:
    title:
      name: Title
      required: true
      example: "Flea market Boxhagener Platz"
      selector:
        text:
    start_time:
      name: Start
      required: true
      example: "2026-07-12T10:00:00+02:00"
      selector:
        text:
    end_time:
      name: End
      required: true
      example: "2026-07-12T16:00:00+02:00"
      selector:
        text:
    category:
      name: Category
      example: "market"
      selector:
        text:
    address:
      name: Address
      example: "Boxhagener Platz 1, 10245 Berlin"
      selector:
        text:
    lat:
      name: Latitude
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    lon:
      name: Longitude
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    recurrence:
      name: Recurrence (RRULE)
      example: "FREQ=WEEKLY;BYDAY=SU"
      selector:
        text:
    time_precision:
      name: Time precision
      selector:
        select:
          options:
            - exact
            - approximate
    schedule_text:
      name: Schedule wording
      example: "Wednesdays 6 pm, ~twice a month"
      selector:
        text:
    source_name:
      name: Source name
      selector:
        text:
    source_url:
      name: Source URL
      selector:
        text:
    confidence:
      name: Confidence
      selector:
        select:
          options:
            - verified
            - scraped
            - inferred
    raw_description:
      name: Description
      selector:
        text:
          multiline: true
    dedupe:
      name: Deduplicate
      description: Merge into an existing event with same title, time and place.
      default: false
      selector:
        boolean:

delete_event:
  name: Delete event
  description: Deletes an event by id.
  fields:
    event_id:
      name: Event ID
      required: true
      selector:
        text:

query:
  name: Query events
  description: >-
    Queries events with combinable filters (result in the response data).
    Either reference a stored profile or pass individual filters.
  fields:
    profile:
      name: Profile (id or name)
      selector:
        text:
    categories:
      name: Categories
      selector:
        object:
    lat:
      name: Latitude (center)
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    lon:
      name: Longitude (center)
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    radius_km:
      name: Radius (km)
      selector:
        number:
          min: 0
          max: 500
          step: any
          mode: box
    start:
      name: Window start
      example: "2026-07-11T00:00:00+02:00"
      selector:
        text:
    end:
      name: Window end
      selector:
        text:
    weekdays:
      name: Weekdays (0=Mon)
      selector:
        object:
    time_from:
      name: Time from
      example: "18:00"
      selector:
        text:
    time_to:
      name: Time to
      selector:
        text:
    text:
      name: Text search
      selector:
        text:
    favorites_only:
      name: Favorites only
      selector:
        boolean:
    limit:
      name: Limit
      selector:
        number:
          min: 1
          max: 1000
          mode: box

lookup_place:
  name: Look up address
  description: >-
    Returns cached coordinates for an address from the address geo cache
    (result in the response data).
  fields:
    address:
      name: Address
      required: true
      selector:
        text:

digest:
  name: Create digest
  description: >-
    Compiles the upcoming events (optionally filtered by a profile) into a
    text digest for notification automations ("this week nearby"). Can send
    directly to a notify service and check occurrences against your own
    calendars for free/busy.
  fields:
    profile:
      name: Profile (id or name)
      selector:
        text:
    days:
      name: Range (days)
      default: 7
      selector:
        number:
          min: 1
          max: 90
          mode: box
    limit:
      name: Max events
      default: 25
      selector:
        number:
          min: 1
          max: 200
          mode: box
    title:
      name: Title
      selector:
        text:
    notify_service:
      name: Notify service
      example: "notify.mobile_app_iphone"
      selector:
        text:
    check_calendars:
      name: Free/busy check against calendars
      example: "calendar.private"
      selector:
        entity:
          multiple: true
          filter:
            domain: calendar

import_ics:
  name: Import ICS
  description: >-
    Imports events from an iCalendar feed (URL, file relative to the config
    directory, or inline content). UIDs become event ids, so re-imports
    update instead of duplicating.
  fields:
    url:
      name: URL
      example: "https://example.org/feed.ics"
      selector:
        text:
    path:
      name: File path
      example: "www/feed.ics"
      selector:
        text:
    data:
      name: ICS content
      selector:
        text:
          multiline: true
    source_name:
      name: Source name
      selector:
        text:
    category:
      name: Category (override)
      selector:
        text:
    dedupe:
      name: Deduplicate
      default: true
      selector:
        boolean:

import_geojson:
  name: Import GeoJSON
  description: >-
    Imports GeoJSON features as events. Times come from the feature
    properties (start_time/end_time) or the provided defaults.
  fields:
    url:
      name: URL
      selector:
        text:
    path:
      name: File path
      selector:
        text:
    data:
      name: GeoJSON content
      selector:
        text:
          multiline: true
    default_start:
      name: Default start
      example: "2026-07-12T10:00:00+02:00"
      selector:
        text:
    default_end:
      name: Default end
      selector:
        text:
    title_property:
      name: Title property
      example: "name"
      selector:
        text:
    source_name:
      name: Source name
      selector:
        text:
    category:
      name: Category (override)
      selector:
        text:
    dedupe:
      name: Deduplicate
      default: true
      selector:
        boolean:

import_gpx:
  name: Import GPX
  description: >-
    Imports GPX tracks as events with LineString geometry. Times come from
    the track points or the provided defaults.
  fields:
    url:
      name: URL
      selector:
        text:
    path:
      name: File path
      selector:
        text:
    data:
      name: GPX content
      selector:
        text:
          multiline: true
    default_start:
      name: Default start
      selector:
        text:
    default_end:
      name: Default end
      selector:
        text:
    source_name:
      name: Source name
      selector:
        text:
    category:
      name: Category
      selector:
        text:
    dedupe:
      name: Deduplicate
      default: true
      selector:
        boolean:

match_visits:
  name: Match visits retroactively
  description: >-
    Matches the recorded position history of your persons (recorder) against
    past events and fills the visit history retroactively. Only reaches back
    as far as the recorder retention (purge_keep_days, default 10 days).
  fields:
    days:
      name: Range (days)
      default: 10
      selector:
        number:
          min: 1
          max: 365
          mode: box
    radius_km:
      name: Radius (km)
      default: 0.5
      selector:
        number:
          min: 0.05
          max: 50
          step: any
          mode: box
    person_entities:
      name: Persons (empty = all)
      selector:
        entity:
          multiple: true
          filter:
            domain: person

backup:
  name: Back up database
  description: >-
    Creates a consistent copy of the event database (SQLite backup API) in
    the config directory; the response contains the path.
  fields:
    filename:
      name: File name
      example: "chronotope-backup.db"
      selector:
        text:

extract_event:
  name: Extract event from text (experimental)
  description: >-
    Lets a conversation agent (LLM) extract a structured event from free
    text - including a best-effort RRULE and fuzzy-time marking. Optionally
    saves it directly (confidence: inferred).
  fields:
    text:
      name: Text
      required: true
      example: "Flea market at Boxhagener Platz, every Sunday 10 am - 4 pm"
      selector:
        text:
          multiline: true
    agent_id:
      name: Conversation agent
      selector:
        conversation_agent:
    save:
      name: Save directly
      default: false
      selector:
        boolean:

purge:
  name: Purge old events
  description: >-
    Deletes events whose end is more than N days in the past. Recurring
    events are only deleted when their rule has run out (COUNT/UNTIL
    reached); unbounded rules are kept.
  fields:
    older_than_days:
      name: Older than (days)
      required: true
      example: 30
      selector:
        number:
          min: 0
          max: 3650
          mode: box
    source_name:
      name: Source only
      selector:
        text:
