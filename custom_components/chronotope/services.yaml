add_event:
  name: Event hinzufügen
  description: >-
    Legt ein Event an oder aktualisiert es (Upsert per id). Zeiten als
    ISO 8601 mit Zeitzone; eine Adresse ohne Koordinaten wird aus dem
    Adress-Geo-Cache aufgelöst, falls bekannt.
  fields:
    title:
      name: Titel
      required: true
      example: "Flohmarkt Boxhagener Platz"
      selector:
        text:
    start_time:
      name: Beginn
      required: true
      example: "2026-07-12T10:00:00+02:00"
      selector:
        text:
    end_time:
      name: Ende
      required: true
      example: "2026-07-12T16:00:00+02:00"
      selector:
        text:
    category:
      name: Kategorie
      example: "market"
      selector:
        text:
    address:
      name: Adresse
      example: "Boxhagener Platz 1, 10245 Berlin"
      selector:
        text:
    lat:
      name: Breitengrad
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    lon:
      name: Längengrad
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    recurrence:
      name: Wiederholung (RRULE)
      example: "FREQ=WEEKLY;BYDAY=SU"
      selector:
        text:
    time_precision:
      name: Zeit-Präzision
      selector:
        select:
          options:
            - exact
            - approximate
    schedule_text:
      name: Zeitangabe (Wortlaut)
      example: "mittwochs 18 Uhr, ca. 2x im Monat"
      selector:
        text:
    source_name:
      name: Quelle
      selector:
        text:
    source_url:
      name: Quell-URL
      selector:
        text:
    confidence:
      name: Konfidenz
      selector:
        select:
          options:
            - verified
            - scraped
            - inferred
    raw_description:
      name: Beschreibung
      selector:
        text:
          multiline: true

delete_event:
  name: Event löschen
  description: Löscht ein Event per id.
  fields:
    event_id:
      name: Event-ID
      required: true
      selector:
        text:

query:
  name: Events abfragen
  description: >-
    Fragt Events mit kombinierbaren Filtern ab (Antwort als Response-Daten).
    Entweder ein gespeichertes Profil angeben oder Einzelfilter.
  fields:
    profile:
      name: Profil (ID oder Name)
      selector:
        text:
    categories:
      name: Kategorien
      selector:
        object:
    lat:
      name: Breitengrad (Zentrum)
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    lon:
      name: Längengrad (Zentrum)
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    radius_km:
      name: Radius (km)
      selector:
        number:
          min: 0
          max: 500
          step: any
          mode: box
    start:
      name: Fensterbeginn
      example: "2026-07-11T00:00:00+02:00"
      selector:
        text:
    end:
      name: Fensterende
      selector:
        text:
    weekdays:
      name: Wochentage (0=Mo)
      selector:
        object:
    time_from:
      name: Uhrzeit von
      example: "18:00"
      selector:
        text:
    time_to:
      name: Uhrzeit bis
      selector:
        text:
    text:
      name: Textsuche
      selector:
        text:
    favorites_only:
      name: Nur Favoriten
      selector:
        boolean:
    limit:
      name: Limit
      selector:
        number:
          min: 1
          max: 1000
          mode: box

import_ics:
  name: ICS importieren
  description: >-
    Importiert Events aus einem iCalendar-Feed (URL, Datei relativ zum
    Config-Verzeichnis oder direkt übergebener Inhalt). UIDs werden zu
    Event-IDs, Re-Importe aktualisieren statt zu duplizieren.
  fields:
    url:
      name: URL
      example: "https://example.org/feed.ics"
      selector:
        text:
    path:
      name: Dateipfad
      example: "www/feed.ics"
      selector:
        text:
    data:
      name: ICS-Inhalt
      selector:
        text:
          multiline: true
    source_name:
      name: Quellenname
      selector:
        text:
    category:
      name: Kategorie (überschreibt)
      selector:
        text:
    dedupe:
      name: Deduplizieren
      default: true
      selector:
        boolean:

import_geojson:
  name: GeoJSON importieren
  description: >-
    Importiert GeoJSON-Features als Events. Zeiten kommen aus den
    Feature-Properties (start_time/end_time) oder den Defaults.
  fields:
    url:
      name: URL
      selector:
        text:
    path:
      name: Dateipfad
      selector:
        text:
    data:
      name: GeoJSON-Inhalt
      selector:
        text:
          multiline: true
    default_start:
      name: Standard-Beginn
      example: "2026-07-12T10:00:00+02:00"
      selector:
        text:
    default_end:
      name: Standard-Ende
      selector:
        text:
    title_property:
      name: Titel-Property
      example: "name"
      selector:
        text:
    source_name:
      name: Quellenname
      selector:
        text:
    category:
      name: Kategorie (überschreibt)
      selector:
        text:
    dedupe:
      name: Deduplizieren
      default: true
      selector:
        boolean:

import_gpx:
  name: GPX importieren
  description: >-
    Importiert GPX-Tracks als Events mit LineString-Geometrie. Zeiten aus
    den Trackpunkten oder den Defaults.
  fields:
    url:
      name: URL
      selector:
        text:
    path:
      name: Dateipfad
      selector:
        text:
    data:
      name: GPX-Inhalt
      selector:
        text:
          multiline: true
    default_start:
      name: Standard-Beginn
      selector:
        text:
    default_end:
      name: Standard-Ende
      selector:
        text:
    source_name:
      name: Quellenname
      selector:
        text:
    category:
      name: Kategorie
      selector:
        text:
    dedupe:
      name: Deduplizieren
      default: true
      selector:
        boolean:

backup:
  name: Datenbank sichern
  description: >-
    Erstellt eine konsistente Kopie der Event-Datenbank (SQLite-Backup-API)
    im Config-Verzeichnis; Antwort enthält den Pfad.
  fields:
    filename:
      name: Dateiname
      example: "chronotope-backup.db"
      selector:
        text:

extract_event:
  name: Event aus Text extrahieren (experimentell)
  description: >-
    Lässt einen Conversation-Agenten (LLM) aus Freitext ein strukturiertes
    Event extrahieren — inkl. Best-Effort-RRULE und Unschärfe-Kennzeichnung.
    Optional direkt speichern (confidence: inferred).
  fields:
    text:
      name: Text
      required: true
      example: "Flohmarkt am Boxhagener Platz, jeden Sonntag 10-16 Uhr"
      selector:
        text:
          multiline: true
    agent_id:
      name: Conversation-Agent
      selector:
        conversation_agent:
    save:
      name: Direkt speichern
      default: false
      selector:
        boolean:

digest:
  name: Digest erzeugen
  description: >-
    Stellt die nächsten Events (optional nach Profil gefiltert) als Text
    zusammen — für Benachrichtigungs-Automationen ("Diese Woche in deiner
    Nähe"). Optional direkt an einen notify-Dienst senden und Termine gegen
    eigene Kalender auf freie Zeit prüfen.
  fields:
    profile:
      name: Profil (ID oder Name)
      selector:
        text:
    days:
      name: Zeitraum (Tage)
      default: 7
      selector:
        number:
          min: 1
          max: 90
          mode: box
    limit:
      name: Max. Events
      default: 25
      selector:
        number:
          min: 1
          max: 200
          mode: box
    title:
      name: Titel
      selector:
        text:
    notify_service:
      name: Notify-Dienst
      example: "notify.mobile_app_iphone"
      selector:
        text:
    check_calendars:
      name: Frei-Zeit-Abgleich gegen Kalender
      example: "calendar.privat"
      selector:
        entity:
          multiple: true
          filter:
            domain: calendar

purge:
  name: Alte Events aufräumen
  description: >-
    Löscht Events, deren Ende länger als N Tage zurückliegt. Wiederkehrende
    Events werden nur gelöscht, wenn die Regel ausgelaufen ist (COUNT/UNTIL
    erreicht); unbegrenzte Regeln bleiben erhalten.
  fields:
    older_than_days:
      name: Älter als (Tage)
      required: true
      example: 30
      selector:
        number:
          min: 0
          max: 3650
          mode: box
    source_name:
      name: Nur Quelle
      selector:
        text:

lookup_place:
  name: Adresse nachschlagen
  description: >-
    Liefert gecachte Koordinaten zu einer Adresse aus dem Adress-Geo-Cache
    (Antwort als Response-Daten).
  fields:
    address:
      name: Adresse
      required: true
      selector:
        text:
