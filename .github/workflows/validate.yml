name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # hacs/action does not read the checkout, it asks the GitHub API for
    # GITHUB_HEAD_REF. On a pull_request event that ref is the source branch,
    # which no longer exists once the PR is merged (or the branch is deleted)
    # while the run is still queued, so the API answers "Not Found" and the
    # action reports "not loaded properly in HACS". The push event for the very
    # same commit validates the branch ref that really exists, so PRs lose no
    # coverage here.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # Until the home-assistant/brands PR is merged.
          ignore: brands

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install python-dateutil
      - run: python3 -m unittest discover -s tests -v

  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed bundle must match the source
        run: git diff --exit-code custom_components/chronotope/frontend/chronotope-panel.js
